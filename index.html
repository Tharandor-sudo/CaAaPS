<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Linkbox">
<title>Linkbox</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@600;700&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: single narrow column, one big tap target per link, grouped by category, search on top. */
:root {
  --bg: #f4f6f7;
  --surface: #ffffff;
  --fg: #14212b;
  --muted: #5d6b76;
  --line: #dde3e7;
  --accent: #0b7a75;
  --accent-soft: #dff1ef;
  --sky-top: #b9d6ea; --sky-bot: #f2efe3; --cloud: #ffffff; --sea: #7fb3c9;
  --hill3: #a9c7a0; --hill2: #86b06f; --hill1: #5f9254; --field: #a3c88a; --hedge: #4a7a43;
  --stone: #d9cfb8; --roof: #7a6f60; --chalk: #f4f4ef; --chalk-shade: #d8dad3; --trunk: #6b5842;
  --font-display: "Bricolage Grotesque", "Helvetica Neue", Arial, sans-serif;
  --font-body: "Figtree", -apple-system, "Helvetica Neue", Arial, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f171d; --surface: #18232b; --fg: #e8eef2; --muted: #93a3af;
    --line: #26343e; --accent: #4fd1c5; --accent-soft: #17312f;
    --sky-top: #0f1a2e; --sky-bot: #3a3f66; --cloud: #5a6088; --sea: #1f3b52;
    --hill3: #27405a; --hill2: #1f4a3d; --hill1: #17382f; --field: #265443; --hedge: #0f2a22;
    --stone: #7d7a86; --roof: #3b3a47; --chalk: #aeb6c4; --chalk-shade: #8d96a8; --trunk: #2a2a2e;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f171d; --surface: #18232b; --fg: #e8eef2; --muted: #93a3af;
  --line: #26343e; --accent: #4fd1c5; --accent-soft: #17312f;
  --sky-top: #0f1a2e; --sky-bot: #3a3f66; --cloud: #5a6088; --sea: #1f3b52;
  --hill3: #27405a; --hill2: #1f4a3d; --hill1: #17382f; --field: #265443; --hedge: #0f2a22;
  --stone: #7d7a86; --roof: #3b3a47; --chalk: #aeb6c4; --chalk-shade: #8d96a8; --trunk: #2a2a2e;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { margin: 0; }
body {
  background: var(--bg); color: var(--fg);
  font-family: var(--font-body); font-size: 16px; line-height: 1.4;
  padding-block: 20px 40px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.hero { position: relative; overflow: hidden; border-radius: 16px; border: 1px solid var(--line); min-height: 210px; background: linear-gradient(var(--sky-top), var(--sky-bot) 75%); }
.hero svg { position: absolute; left: 0; bottom: 0; width: 100%; height: 100%; display: block; }
.hero .heroText { position: relative; padding: 16px 18px; }
.wrap { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
h1 { font-family: var(--font-display); font-size: 30px; line-height: 1.1; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 4px 0 0; font-size: 15px; }
.search {
  width: 100%; font: inherit; font-size: 16px; color: var(--fg);
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 13px 14px;
}
.search:focus-visible, .link:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.group { display: flex; flex-direction: column; gap: 8px; }
.group h2 {
  font-size: 12px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase;
  color: var(--muted); margin: 0; padding-left: 2px;
}
.list { display: flex; flex-direction: column; gap: 8px; }
.link {
  display: flex; align-items: center; gap: 14px; min-width: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
  padding: 12px 14px; min-height: 60px; color: inherit; text-decoration: none;
  -webkit-tap-highlight-color: transparent;
}
.link:active { background: var(--accent-soft); }
.mark {
  flex: none; width: 36px; height: 36px; border-radius: 10px;
  background: var(--accent-soft); color: var(--accent);
  display: grid; place-items: center; font-family: var(--font-display); font-weight: 700; font-size: 17px;
}
.txt { min-width: 0; flex: 1; }
.name { font-weight: 600; overflow-wrap: anywhere; }
.host { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chev { flex: none; color: var(--muted); font-size: 20px; }
.empty { color: var(--muted); text-align: center; padding: 24px 0; }
.group h3 { font-size: 15px; font-weight: 600; margin: 10px 0 0; padding-left: 2px; }
.frame { width: 100%; aspect-ratio: 16 / 9; max-width: 100%; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.item { display: flex; flex-direction: column; gap: 6px; }
.link.on { border-color: var(--accent); }
.player { display: flex; flex-direction: column; gap: 6px; padding: 2px 2px 4px; }
.player audio { width: 100%; }
.player a { color: var(--accent); font-size: 13px; }
.disclaimer { color: var(--muted); font-size: 13px; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; margin: 0; }
.tip { color: var(--muted); font-size: 13px; text-align: center; margin: 0; }
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <svg viewBox="0 0 800 420" preserveAspectRatio="xMidYMax slice" xmlns="http://www.w3.org/2000/svg">
      <g style="fill:var(--cloud)" opacity="0.85">
        <ellipse cx="140" cy="60" rx="70" ry="16"/><ellipse cx="180" cy="48" rx="45" ry="15"/>
        <ellipse cx="560" cy="90" rx="80" ry="15"/><ellipse cx="600" cy="78" rx="50" ry="14"/>
      </g>
      <path style="fill:var(--hill3)" d="M0 250 C100 210 190 215 290 240 C390 262 470 215 560 222 L640 235 L640 420 L0 420Z"/>
      <path style="fill:var(--sea)" d="M620 262 L800 262 L800 420 L620 420Z"/>
      <path style="fill:var(--chalk-shade)" d="M690 200 L800 190 L800 420 L660 420 L672 300Z"/>
      <path style="fill:var(--chalk)" d="M688 200 L720 196 L724 232 L742 238 L748 300 L760 330 L735 420 L680 420 L668 330 L676 290 L682 240Z"/>
      <path style="fill:var(--hill2)" d="M650 215 Q690 190 760 186 L800 184 L800 200 L720 202 Q690 206 676 222Z"/>
      <path style="fill:var(--hill2)" d="M0 300 C80 262 170 255 260 278 C350 300 430 270 520 266 C590 262 640 285 700 300 L700 420 L0 420Z"/>
      <g style="fill:none;stroke:var(--field)" stroke-width="2" opacity="0.9">
        <path d="M10 330 Q120 290 250 310"/><path d="M40 360 Q170 315 330 338"/>
        <path d="M300 300 Q420 276 560 292"/><path d="M360 340 Q480 305 640 328"/>
        <path d="M90 290 L130 400"/><path d="M200 282 L170 400"/><path d="M430 280 L420 400"/><path d="M540 285 L560 400"/>
      </g>
      <g>
        <rect x="262" y="236" width="42" height="28" style="fill:var(--stone)"/>
        <rect x="304" y="222" width="16" height="42" style="fill:var(--stone)"/>
        <path d="M300 222 L312 190 L324 222Z" style="fill:var(--roof)"/>
        <path d="M258 236 L283 220 L308 236Z" style="fill:var(--roof)"/>
        <rect x="308" y="232" width="5" height="9" rx="2" style="fill:var(--roof)"/>
      </g>
      <g>
      <rect x="439" y="212" width="2" height="62" style="fill:var(--trunk)"/>
      <svg x="441" y="212" width="42" height="21" viewBox="0 0 60 30">
        <clipPath id="ujS"><path d="M0,0 v30 h60 v-30 z"/></clipPath>
        <clipPath id="ujT"><path d="M30,15 h30 v15 z v15 h-30 z h-30 v-15 z v-15 h30 z"/></clipPath>
        <g clip-path="url(#ujS)">
          <path d="M0,0 v30 h60 v-30 z" fill="#012169"/>
          <path d="M0,0 L60,30 M60,0 L0,30" stroke="#fff" stroke-width="6"/>
          <path d="M0,0 L60,30 M60,0 L0,30" clip-path="url(#ujT)" stroke="#C8102E" stroke-width="4"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#fff" stroke-width="10"/>
          <path d="M30,0 v30 M0,15 h60" stroke="#C8102E" stroke-width="6"/>
        </g>
      </svg>
    </g>
    <path style="fill:var(--hill1)" d="M0 350 C90 320 180 322 280 345 C380 366 470 330 570 326 C650 322 720 340 800 352 L800 420 L0 420Z"/>
      <g style="fill:var(--hedge)">
        <circle cx="60" cy="342" r="14"/><circle cx="82" cy="344" r="11"/><circle cx="104" cy="340" r="12"/>
        <circle cx="420" cy="346" r="12"/><circle cx="442" cy="342" r="14"/><circle cx="466" cy="344" r="11"/>
        <circle cx="610" cy="334" r="13"/><circle cx="632" cy="336" r="10"/>
      </g>
      <g>
        <rect x="195" y="352" width="5" height="22" style="fill:var(--trunk)"/><circle cx="197" cy="344" r="22" style="fill:var(--hedge)"/>
        <rect x="530" y="348" width="5" height="22" style="fill:var(--trunk)"/><circle cx="532" cy="340" r="19" style="fill:var(--hedge)"/>
      </g>
    </svg>
    <div class="heroText">
      <h1>Linkbox</h1>
      <p class="sub" id="count"></p>
    </div>
  </header>
  <p class="disclaimer">Hinweis: Die verlinkten Inhalte sind urheberrechtlich gesch&uuml;tzt und d&uuml;rfen nur mit einer offiziellen Lizenz des Lehrmittels verwendet werden. Diese Seite enth&auml;lt selbst keine Inhalte, sondern nur Links.</p>
  <input class="search" id="q" type="search" placeholder="Links suchen" autocomplete="off" aria-label="Links suchen">
  <main id="out"></main>
  <p class="tip">Tipp iPhone: In Safari auf Teilen tippen und &laquo;Zum Home-Bildschirm&raquo; w&auml;hlen.</p>
</div>

<script>
var LINKS = [
  { group: "Compact Advanced, Unit 1", name: "Audio Track 02", url: "https://content.cambridgeone.org/cup1/products/cmpa2edc1insbrbak/6/assets/audio/1699000751874/Compact_Adv_2ed_Unit%201_Audio_Track02.mp3" },
  { group: "Compact Advanced, Unit 1", name: "Audio Track 03", url: "https://content.cambridgeone.org/cup1/products/cmpa2edc1insbrbak/6/assets/audio/1699000751875/Compact_Adv_2ed_Unit%201_Audio_Track03.mp3" },
  { group: "Compact Advanced, Unit 1", name: "Audio Track 04", url: "https://content.cambridgeone.org/cup1/products/cmpa2edc1insbrbak/6/assets/audio/1699000751876/Compact_Adv_2ed_Unit%201_Audio_Track04.mp3" },
  { group: "Compact Advanced, Unit 1", sub: "Grammar on the move", name: "Video a \u2013 Review of verb tenses", url: "https://www.cambridge.org/CPA_Advanced_2ed_Vid1" },
  { group: "Compact Advanced, Unit 1", sub: "Grammar on the move", name: "Video b \u2013 Review of verb tenses", url: "https://www.cambridge.org/CPA_Advanced_2ed_Vid2" },
  { group: "Compact Advanced, Unit 1", sub: "Grammar on the move", name: "Video c \u2013 Review of verb tenses", url: "https://www.cambridge.org/CPA_Advanced_2ed_Vid3" },
  { group: "Compact Advanced, Unit 1", sub: "Grammar on the move", name: "Video d \u2013 Review of verb tenses", url: "https://www.cambridge.org/CPA_Advanced_2ed_Vid4" }
];

var out = document.getElementById("out");
var q = document.getElementById("q");
var count = document.getElementById("count");

function host(u) { try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return u; } }

function closePlayers() {
  document.querySelectorAll(".player").forEach(function (p) {
    var m = p.querySelector("audio"); if (m) m.pause();
    p.remove();
  });
  document.querySelectorAll(".link.on").forEach(function (x) { x.classList.remove("on"); });
}

function makeItem(l) {
  var a = document.createElement("a");
  a.className = "link"; a.href = l.url; a.target = "_blank"; a.rel = "noopener";
  a.innerHTML = '<span class="mark"></span><span class="txt"><div class="name"></div><div class="host"></div></span><span class="chev" aria-hidden="true">&rsaquo;</span>';
  a.querySelector(".mark").textContent = l.name.charAt(0).toUpperCase();
  a.querySelector(".name").textContent = l.name;
  a.querySelector(".host").textContent = host(l.url);
  var item = document.createElement("div"); item.className = "item";
  item.appendChild(a);
  var isAudio = /\.mp3($|\?)/i.test(l.url);
  if (isAudio || l.embed) {
    a.addEventListener("click", function (ev) {
      ev.preventDefault();
      var wasOpen = item.querySelector(".player");
      closePlayers();
      if (wasOpen) return;
      var box = document.createElement("div"); box.className = "player";
      if (isAudio) {
        var au = document.createElement("audio"); au.controls = true; au.autoplay = true; au.preload = "auto"; au.src = l.url;
        box.appendChild(au);
      } else {
        var fr = document.createElement("iframe"); fr.className = "frame"; fr.src = l.url; fr.title = l.name;
        fr.setAttribute("allow", "autoplay; fullscreen; picture-in-picture"); fr.setAttribute("allowfullscreen", "");
        box.appendChild(fr);
      }
      var alt = document.createElement("a"); alt.href = l.url; alt.target = "_blank"; alt.rel = "noopener"; alt.textContent = "In neuem Tab öffnen";
      box.appendChild(alt); item.appendChild(box); a.classList.add("on");
    });
  }
  return item;
}

function makeList(items) {
  var list = document.createElement("div"); list.className = "list";
  items.forEach(function (l) { list.appendChild(makeItem(l)); });
  return list;
}

function render() {
  var term = q.value.trim().toLowerCase();
  var shown = LINKS.filter(function (l) {
    return !term || (l.name + " " + l.group + " " + (l.sub || "") + " " + l.url).toLowerCase().indexOf(term) > -1;
  });
  count.textContent = shown.length + (shown.length === 1 ? " Link" : " Links");
  out.textContent = "";
  if (!shown.length) {
    var e = document.createElement("p"); e.className = "empty"; e.textContent = "Keine Treffer."; out.appendChild(e); return;
  }
  var groups = [];
  shown.forEach(function (l) { if (groups.indexOf(l.group) < 0) groups.push(l.group); });
  var frag = document.createDocumentFragment();
  groups.forEach(function (g) {
    var inGroup = shown.filter(function (l) { return l.group === g; });
    var sec = document.createElement("section"); sec.className = "group";
    var h = document.createElement("h2"); h.textContent = g; sec.appendChild(h);
    var plain = inGroup.filter(function (l) { return !l.sub; });
    if (plain.length) sec.appendChild(makeList(plain));
    var subs = [];
    inGroup.forEach(function (l) { if (l.sub && subs.indexOf(l.sub) < 0) subs.push(l.sub); });
    subs.forEach(function (sname) {
      var h3 = document.createElement("h3"); h3.textContent = sname; sec.appendChild(h3);
      sec.appendChild(makeList(inGroup.filter(function (l) { return l.sub === sname; })));
    });
    frag.appendChild(sec);
  });
  out.appendChild(frag);
}
out.style.display = "flex"; out.style.flexDirection = "column"; out.style.gap = "20px";
q.addEventListener("input", render);
render();
</script>

</body>
</html>
